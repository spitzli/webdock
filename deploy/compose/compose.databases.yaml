# Explicit optional gateway; customer database servers are never provisioned here.
name: webdock
services:
  database-gateway:
    profiles: [databases]
    image: ${WEBDOCK_DATABASE_GATEWAY_IMAGE:?Set the immutable gateway image with verified Tabularis runtime}
    env_file: [./database-gateway.env]
    environment:
      TABULARIS_EXPECTED_COMMIT: ${TABULARIS_EXPECTED_COMMIT:?Use vendor/tabularis-web-ui.json sourceCommit}
    restart: unless-stopped
    read_only: true
    user: '65532:65532'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=256m,mode=1777']
    pids_limit: 256
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 30s
    ports: ['127.0.0.1:3137:3137']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3137/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
