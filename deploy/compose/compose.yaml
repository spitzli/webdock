# Isolated single-host candidate. Managed workloads stay on the existing Kubernetes cluster.
name: webdock-native
x-runtime: &runtime
  restart: unless-stopped
  user: '65532:65532'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:rw,nosuid,size=64m,mode=1777']
  pids_limit: 256
  mem_limit: 1g
  cpus: 1
  stop_grace_period: 30s
services:
  core:
    <<: *runtime
    image: ${WEBDOCK_CORE_IMAGE:?Set the reviewed immutable native Core image}
    env_file: [./core.env]
    ports: ['127.0.0.1:3130:3130']
