{{- if .Values.enabled }}
{{- $name := printf "%s-agent" .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-inventory
rules:
  - apiGroups: ['']
    resources: [nodes, namespaces]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-inventory
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Namespace }}-{{ $name }}-inventory}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }}}
{{- range .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $name }}, namespace: {{ . }}}
rules:
  - {apiGroups: [''], resources: [pods, services, persistentvolumeclaims], verbs: [get, list]}
  - {apiGroups: [''], resources: [pods/log], verbs: [get]}
  - {apiGroups: [apps], resources: [deployments, statefulsets, daemonsets], verbs: [get, list, patch]}
  - {apiGroups: [apps], resources: [deployments/scale, statefulsets/scale], verbs: [get, patch]}
  - {apiGroups: [batch], resources: [jobs], verbs: [get, list]}
  - {apiGroups: [batch], resources: [cronjobs], verbs: [get, list, patch]}
  - {apiGroups: [autoscaling], resources: [horizontalpodautoscalers], verbs: [get, list]}
  - {apiGroups: [networking.k8s.io], resources: [ingresses], verbs: [get, list]}
  - {apiGroups: [metrics.k8s.io], resources: [pods], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $name }}, namespace: {{ . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: initialize-private-state
          image: {{ .Values.image | quote }}
          command: [python3, -c]
          args:
            - "import os,pathlib; p=pathlib.Path('/state/connection.json'); p.exists() or p.write_bytes(pathlib.Path('/enrollment/connection.json').read_bytes()); os.chmod(p,0o600)"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{ .Values.resources | toJson }}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: enrollment, mountPath: /enrollment, readOnly: true}
      containers:
        - name: agent
          image: {{ .Values.image | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{ .Values.resources | toJson }}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: {{ .Values.existingClaim }}}
        - name: enrollment
          secret: {secretName: {{ .Values.existingSecret }}, defaultMode: 288}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: {{ .Values.egress | toJson }}
{{- end }}
