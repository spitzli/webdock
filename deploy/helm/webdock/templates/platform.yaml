{{- $image := required "image is required" .Values.image -}}
{{- $apiHost := required "apiHost must match the authority of WEBDOCK_API_ORIGIN" .Values.apiHost -}}
{{- if not (regexMatch "^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9_./-]+@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "image must be pinned by SHA-256 digest" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: core}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: core}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: core
          image: {{ $image | quote }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret | quote }}
          ports:
            - {name: http, containerPort: 3130}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{ .Values.resources | toJson }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders:
                - {name: Host, value: {{ $apiHost | quote }}}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - {name: Host, value: {{ $apiHost | quote }}}
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - {name: Host, value: {{ $apiHost | quote }}}
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-core
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: core}
  ports:
    - {name: http, port: 3130, targetPort: http}
