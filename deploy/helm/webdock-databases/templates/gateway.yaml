{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-database-gateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: database-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: database-gateway}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: {{ .Values.image | quote }}
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: TABULARIS_EXPECTED_COMMIT, value: {{ .Values.tabularisCommit | quote }}}
            - {name: WEBDOCK_DATABASE_MANAGED_RUNTIMES, value: {{ .Values.managedRuntimes | toString | quote }}}
            - {name: WEBDOCK_DATABASE_RUNTIME_CAPACITY, value: {{ .Values.runtimeCapacity | toString | quote }}}
            {{- if .Values.runtimeCAConfigMap }}
            - {name: WEBDOCK_DATABASE_RUNTIME_CA_FILE, value: /runtime-trust/ca.crt}
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources: {{ .Values.resources | toJson }}
          ports: [{name: http, containerPort: 3137}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.runtimeCAConfigMap }}
            - {name: runtime-ca, mountPath: /runtime-trust, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
        {{- if .Values.runtimeCAConfigMap }}
        - name: runtime-ca
          configMap: {name: {{ .Values.runtimeCAConfigMap }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-database-gateway
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: database-gateway}
  ports: [{name: http, port: 3137, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database-gateway
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: database-gateway}
  policyTypes: [Ingress, Egress]
  ingress: {{ .Values.networkPolicy.ingress | toJson }}
  egress: {{ .Values.networkPolicy.egress | toJson }}
{{- end }}
