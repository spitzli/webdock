[package]
name = "webdock-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["service"]
service = ["dep:webdock-export-protocol","dep:webdock-browser-session","dep:sea-orm", "dep:tokio", "dep:webdock-identity", "dep:webdock-persistence", "dep:webdock-hosting", "dep:hmac", "dep:subtle", "dep:oci-client", "dep:rustls", "dep:getrandom", "dep:base64", "dep:axum", "dep:reqwest", "dep:url", "dep:webdock-repository-protocol", "dep:webdock-plugin-host", "dep:webdock-plugin-runtime", "dep:tonic", "dep:uuid"]
worker = ["dep:tokio", "dep:reqwest", "dep:url", "dep:oci-client", "dep:rustls", "dep:base64"]
local-registry-test = ["service", "worker"]

[dependencies]
webdock-export-protocol={path="../export-protocol",optional=true}
webdock-browser-session={path="../browser-session",optional=true}
webdock-object-storage = { path = "../object-storage" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
tempfile = "3"
libc = "0.2"
sea-orm = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
webdock-identity = { path = "../identity", optional = true }
webdock-persistence = { path = "../persistence", optional = true }
webdock-hosting = { path = "../hosting", optional = true }
hmac = { version = "0.12", optional = true }
chrono.workspace = true
subtle = { version = "2.6", optional = true }

axum = { workspace = true, optional = true }
reqwest = { version="0.13", default-features=false, features=["json","rustls-no-provider","stream"], optional=true }
url = { workspace=true, optional=true }
getrandom = { version="0.2", optional=true }
base64 = { version="0.22", optional=true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"], optional = true }

webdock-repository-protocol={path="../repository-protocol",optional=true}
webdock-plugin-host={path="../plugin-host",optional=true}
webdock-plugin-runtime={path="../plugin-runtime",optional=true}
ed25519-dalek="2"
tonic={version="0.14.6",default-features=false,features=["codegen","transport","tls-ring"],optional=true}
uuid={version="1",features=["v4"],optional=true}

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }
webdock-object-storage = { path = "../object-storage", features = ["local-test"] }
url.workspace = true
webdock-ids = { path = "../ids" }

[[bin]]
name="webdock-build-worker"
path="src/bin/webdock-build-worker.rs"
required-features=["worker"]

[lints]
workspace = true
