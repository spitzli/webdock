[package]
name = "webdock-agent-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
webdock-persistence = { path = "../persistence" }
webdock-agent-protocol = { path = "../agent-protocol" }
webdock-hosting = { path = "../hosting" }
webdock-databases = { path = "../databases" }
webdock-mail = { path = "../mail" }
webdock-plugin-runtime = { path = "../plugin-runtime" }
webdock-supervisor = { path = "../supervisor", default-features = false }
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
sha2 = "0.10"
hex = "0.4"
prost = "0.14"
chrono.workspace = true
subtle = "2"
tokio-stream = { version = "0.1", features = ["net"] }

[dev-dependencies]
webdock-control-plane = { path = "../control-plane" }
webdock-access = { path = "../access" }
webdock-core = { path = "../core" }
axum.workspace = true
async-trait.workspace = true
rcgen = "0.14"
webdock-ids = { path = "../ids" }
tempfile = "3"
rustix = { version = "1", features = ["process"] }
url.workspace = true
webdock-agent = { path = "../agent", default-features = false, features = ["kubernetes", "docker"] }
webdock-mail = { path = "../mail", features = ["test-support"] }
webdock-browser-session = { path = "../browser-session" }
futures-util = "0.3"
bollard = "0.21"
base64 = "0.22"
webdock-identity = { path = "../identity" }
totp-rs = { version = "=6.0.0", features = ["otpauth"] }
uuid = { version = "1", features = ["v4"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "config", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
