[package]
name = "webdock-mail-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-support = []

[dependencies]
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
url.workspace = true
thiserror.workspace = true
axum.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
ed25519-dalek = "2"
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport", "tls-ring"] }
tokio-stream = "0.1"
webdock-mail-protocol = { path = "../mail-protocol" }
webdock-plugin-runtime = { path = "../plugin-runtime" }
webdock-mail-message = { path = "../mail-message" }
mail-send = { version = "0.6.2", default-features = false, features = ["ring", "tls12"] }
smtp-proto = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
rustix = { version = "1", features = ["fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
tokio = { workspace = true, features = ["process", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"

[lints]
workspace = true
