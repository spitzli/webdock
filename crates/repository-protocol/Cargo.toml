[package]
name="webdock-repository-protocol"
version="0.1.0"
edition="2024"
rust-version="1.94"
license="AGPL-3.0-only"

[dependencies]
webdock-plugin-protocol={path="../plugin-protocol"}
webdock-plugin-runtime={path="../plugin-runtime"}
serde={version="1",features=["derive"]}
serde_json="1"
ed25519-dalek="2"
sha2="0.10"
hex="0.4"
base64="0.22"
uuid={version="1",features=["v4"]}
async-trait="0.1"
tokio={version="1",features=["macros","rt-multi-thread","sync","time","net"]}
tokio-stream={version="0.1",features=["net"]}
tonic={version="0.14.6",default-features=false,features=["codegen","transport","tls-ring"]}
tonic-prost="0.14.6"
prost="0.14"
rustix={version="1",features=["process"]}

[build-dependencies]
tonic-prost-build="0.14.6"

[dev-dependencies]
tempfile="3"

[lints]
workspace = true
