[package]
name = "webdock-storage-producer-fixture"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
webdock-object-storage-plugin = { path = "../../../../plugins/object-storage" }
webdock-plugin-host = { path = "../.." }
webdock-plugin-protocol = { path = "../../../plugin-protocol" }
webdock-plugin-http = { path = "../../../plugin-http" }
webdock-plugin-kit = { path = "../../../plugin-kit" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
futures-util = "0.3"
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
[profile.dev]
debug = 0
