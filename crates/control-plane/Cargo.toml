[package]
name = "webdock-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "webdock-control-plane"

[dependencies]
webdock-export-protocol={path="../export-protocol"}
rmcp={version="=3.5.1",default-features=false,features=["server","transport-streamable-http-server"]}
webdock-build={path="../build"}
webdock-plugin-host={path="../plugin-host"}
webdock-plugin-protocol={path="../plugin-protocol"}
webdock-repository-protocol={path="../repository-protocol"}
ed25519-dalek="2"
hex="0.4"
getrandom="0.2"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
webdock-mail = { path = "../mail" }
webdock-databases = { path = "../databases" }
sha2 = "0.10"
subtle = "2.6"
webdock-core = { path = "../core" }
webdock-identity = { path = "../identity" }
webdock-registry = { path = "../registry" }
webdock-persistence = { path = "../persistence" }
webdock-ids = { path = "../ids" }
webdock-oauth = { path = "../oauth" }
webdock-browser-session = { path = "../browser-session" }
webdock-access = { path = "../access" }
webdock-hosting = { path = "../hosting" }
webdock-agent-control = { path = "../agent-control" }
webdock-agent-protocol = { path = "../agent-protocol" }
webdock-plugin-runtime = { path = "../plugin-runtime" }
webdock-plugin-http = { path = "../plugin-http" }
tonic = { version = "0.14.6", features = ["transport", "tls-ring"] }
rustix = { version = "1", features = ["process", "fs"] }
base64 = "0.22"
percent-encoding = "2"
loco-rs.workspace = true
sea-orm.workspace = true
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
axum.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio.workspace = true
tokio-stream={version="0.1",features=["net"]}
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "fs"] }
governor = "0.10.4"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webdock-agent = { path = "../agent", default-features = false, features = ["docker"] }
webdock-plugin-kit = { path = "../plugin-kit" }
tokio-postgres = "0.7"
serde-saphyr = "0.0.29"
tempfile = "3"
webdock-secrets = { path = "../secrets" }
http-body-util = "0.1"
totp-rs = { version = "=6.0.0", features = ["otpauth"] }

[lints]
workspace = true
