[package]
name = "webdock-agent-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"

[dependencies]
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport", "tls-ring"] }
tonic-prost = "0.14.6"
prost = "0.14"
sha2 = "0.10"
x509-parser = "0.18"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
hex = "0.4"
uuid = "1"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
