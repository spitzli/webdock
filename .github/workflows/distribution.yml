name: Distribution candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic candidate version
        required: true
        type: string
      include_databases:
        description: Include verified native database gateway and Tabularis artifacts
        required: false
        default: false
        type: boolean
      tabularis_image:
        description: Immutable Tabularis image matching vendor sourceCommit (required for databases)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Do not run untrusted PR code on private runners. Runner must be ephemeral in the EU.
    runs-on: [self-hosted, linux, x64, eu, ephemeral]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate and build without provider credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          WEBDOCK_RELEASE_DATABASES: ${{ inputs.include_databases }}
          TABULARIS_IMAGE: ${{ inputs.tabularis_image }}
        run: |
          npm ci --no-audit --no-fund
          node --test tools/release/manifest.test.mjs
          node --import tsx tools/release/generate-chart-schema.ts --check
          python3 tools/release/check-charts.py
          python3 tools/release/check-compose.py
          tools/release/build.sh "$RELEASE_VERSION" .release linux/amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: .release/
          if-no-files-found: error
          retention-days: 7
  sign:
    needs: build
    runs-on: [self-hosted, linux, x64, eu, ephemeral]
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: distribution
          path: .release
      - name: Sign checksums with runner-installed cosign
        run: cosign sign-blob --yes --bundle .release/SHA256SUMS.sigstore.json .release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-distribution
          path: .release/
          if-no-files-found: error
          retention-days: 14
