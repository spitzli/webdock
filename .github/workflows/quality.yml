name: Native quality

# Same-repository pushes are trusted contributor code. Never execute fork PR code on
# private runners; a maintainer can run this workflow explicitly for a reviewed branch.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, linux, x64, eu, ephemeral]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check isolated runner tooling
        run: |
          node --eval 'if (process.versions.node.split(".")[0] !== "24") throw Error("Node24 required")'
          cargo --version
          protoc --version
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser for isolated UI fixtures
        run: npm exec --workspace @webdock/console-ui -- playwright install chromium
      - name: Enforce native quality and local tests
        run: npm run quality
