name: Native quality

# Same-repository pushes are trusted contributor code. Never execute fork PR code on
# private runners; a maintainer can run this workflow explicitly for a reviewed branch.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, linux, x64, eu, ephemeral]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check isolated runner tooling
        run: |
          bun --version
          cargo --version
          protoc --version
          helm version --short
          python3 -c 'import yaml'
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install browser for isolated UI fixtures
        working-directory: apps/console
        run: bunx playwright install chromium
      - name: Enforce native quality and local tests
        run: bun run quality
      - name: Verify native deployment manifests and probe routing
        run: bun run test:distribution
