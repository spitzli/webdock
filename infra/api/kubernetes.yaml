apiVersion: v1
kind: Namespace
metadata:
  name: webdock-platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: webdock-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: webdock-api}
  template:
    metadata:
      labels: {app: webdock-api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: docker.io/library/webdock-api@sha256:05459ef2b7e9ed2bd1aa8afe39f8911141e2b19b1d642e5af5369100af0c20fa
          imagePullPolicy: Never
          env:
            - name: VIEW_CACHE_RELEASE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['pod-template-hash']
            # Match the platform pooler's per-role concurrency within its total budget of 10.
            - {name: DATABASE_POOL_MAX, value: "2"}
            - {name: REGISTRY_POOL_MAX, value: "2"}
            - {name: WEBDOCK_CONSOLE_ORIGIN, value: "https://console.webdock.dev"}
            - {name: WEBDOCK_SETUP_ENABLED, value: "true"}
            - {name: MAIL_API_ORIGIN, value: "https://api.webdock.dev"}
            - {name: SMTP_PORT, value: "587"}
            - {name: WEBDOCK_APPLICATION_MAIL_EGRESS_CIDRS, value: "178.104.141.95/32"}
          envFrom:
            - secretRef: {name: api-runtime}
          ports:
            - {name: http, containerPort: 3130}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 32Mi}
            limits: {cpu: '1', memory: 768Mi, ephemeral-storage: 128Mi}
          startupProbe:
            exec:
              command: [bun, -e, "if(!(await fetch('http://127.0.0.1:3130/healthz')).ok)process.exit(1)"]
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [bun, -e, "if(!(await fetch('http://127.0.0.1:3130/healthz')).ok)process.exit(1)"]
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [bun, -e, "if(!(await fetch('http://127.0.0.1:3130/readyz')).ok)process.exit(1)"]
            periodSeconds: 20
            timeoutSeconds: 15
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: webdock-platform
spec:
  selector: {app: webdock-api}
  ports:
    - {name: http, port: 3130, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: webdock-platform
spec:
  podSelector:
    matchLabels: {app: webdock-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 3130}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-budget
  namespace: webdock-platform
spec:
  hard:
    pods: '5'
    requests.cpu: 500m
    requests.memory: 768Mi
    requests.ephemeral-storage: 128Mi
    limits.cpu: '3500m'
    limits.memory: 2560Mi
    limits.ephemeral-storage: 512Mi
    count/secrets: '8'
    count/configmaps: '4'
    services: '5'
    services.loadbalancers: '0'
    services.nodeports: '0'
    persistentvolumeclaims: '1'
    requests.storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: webdock-platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
