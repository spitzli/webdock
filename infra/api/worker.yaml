apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: webdock-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: webdock-worker
  template:
    metadata:
      labels:
        app: webdock-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: docker.io/library/webdock-api@sha256:568a3d4665d953a97f4c90d30e1232d28d3ffc348f98b44834e722cdc82b33f2
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: worker-runtime
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 64Mi
        startupProbe:
          exec:
            command:
            - bun
            - -e
            - process.env.WEBDOCK_PROCESS_ROLE='worker';const{databasePools,workerDatabase}=await
              import('./dist/db/runtime.ts');try{await(await import('./dist/db/readiness.ts')).verifyWorkerReadiness(workerDatabase,['billing','storage','hosting']);}finally{await
              databasePools.close();}
          periodSeconds: 10
          timeoutSeconds: 15
          failureThreshold: 12
        livenessProbe:
          exec:
            command:
            - bun
            - -e
            - process.kill(1,0)
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          exec:
            command:
            - bun
            - -e
            - process.env.WEBDOCK_PROCESS_ROLE='worker';const{databasePools,workerDatabase}=await
              import('./dist/db/runtime.ts');try{await(await import('./dist/db/readiness.ts')).verifyWorkerReadiness(workerDatabase,['billing','storage','hosting']);}finally{await
              databasePools.close();}
          periodSeconds: 60
          timeoutSeconds: 15
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        command:
        - bun
        - dist/worker.ts
        env:
        - name: WEBDOCK_SETUP_ENABLED
          value: 'true'
        - name: MAIL_API_ORIGIN
          value: https://api.webdock.dev
        - name: WEBDOCK_APPLICATION_MAIL_EGRESS_CIDRS
          value: 178.104.141.95/32
        - name: WEBDOCK_WORKER_DOMAINS
          value: billing,storage,hosting
        - name: WEBDOCK_GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: api-runtime
              key: WEBDOCK_GITHUB_APP_ID
        - name: WEBDOCK_GITHUB_APP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: api-runtime
              key: WEBDOCK_GITHUB_APP_PRIVATE_KEY
        - name: WEBDOCK_DATABASE_CLUSTER_ID
          valueFrom:
            secretKeyRef:
              name: api-runtime
              key: WEBDOCK_DATABASE_CLUSTER_ID
        - name: WEBDOCK_DATABASE_DOMAIN
          valueFrom:
            secretKeyRef:
              name: api-runtime
              key: WEBDOCK_DATABASE_DOMAIN
        - name: WEBDOCK_HOSTING_EU_VERIFIED
          valueFrom:
            secretKeyRef:
              name: api-runtime
              key: WEBDOCK_HOSTING_EU_VERIFIED
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
