[package]
name = "webdock-archives-native"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace]

[lib]
name = "webdock_archives"
path = "../src/lib.rs"

[[bin]]
name = "webdock-archives"
path = "../src/main.rs"


[dependencies]
webdock-export-protocol={path="../../../crates/export-protocol"}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "fs"] }
webdock-plugin-protocol = { path = "../../../crates/plugin-protocol" }
webdock-plugin-runtime = { path = "../../../crates/plugin-runtime" }
webdock-plugin-kit = { path = "../../../crates/plugin-kit" }
tonic = { version = "0.14.6", features = ["transport"] }
ed25519-dalek = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
webdock-object-storage = { path = "../../../crates/object-storage" }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
url = "2"
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
flate2 = "1"
sha2 = "0.10"
async-trait = "0.1"
tempfile = "3"

[features]
local-native-fixture = []
local-test = ["webdock-object-storage/local-test"]

# Mirrors the root workspace policy; checked by tools/quality.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
as_ptr_cast_mut = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cast_lossless = "deny"
checked_conversions = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
exit = "deny"
fallible_impl_from = "deny"
implicit_clone = "deny"
let_underscore_future = "deny"
lossy_float_literal = "deny"
manual_assert = "deny"
manual_let_else = "deny"
match_wildcard_for_single_variants = "deny"
mem_forget = "deny"
mut_mut = "deny"
needless_continue = "deny"
needless_pass_by_ref_mut = "deny"
option_option = "deny"
rc_mutex = "deny"
redundant_else = "deny"
ref_option_ref = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_box_returns = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnested_or_patterns = "deny"

[profile.dev]
debug = 0
